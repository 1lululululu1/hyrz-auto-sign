name: 游戏自动签到

on:
  schedule:
    - cron: '*/2 * * * *'

  workflow_dispatch:

  # 🔑 新增：允许外部服务通过 API 触发（关键！）
  repository_dispatch:
    types: [cron_trigger]  # 事件类型，可自定义

jobs:
  game-sign:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 执行多账号签到
        env:
          GAME_ACCOUNTS: ${{ secrets.GAME_ACCOUNTS }}
          FEISHU_WEBHOOK: ${{ secrets.FEISHU_WEBHOOK }}
        run: |
          python game_sign.py
